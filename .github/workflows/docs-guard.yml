# Docs acompanham o código — guard de PR (ATIVO desde 14/10/2026, decisão do dono).
#
# Cada tipo de mudança cobra o documento dono do assunto (matriz em
# docs/GOVERNANCA_DOCUMENTACAO.md §3), e toda mudança em src/** ou supabase/**
# cobra também o docs/planejamento/ROADMAP.md. A regra mora em
# scripts/check-docs-matriz.mjs (com testes no gate); rode local com
#     node scripts/check-docs-matriz.mjs --base origin/main
#
# Escape auditável, no corpo da PR, em linha própria e sem indentação:
#     docs: não se aplica — <motivo real>
#
# Workflow SEPARADO do quality.yml de propósito: o tipo `edited` redispara
# SÓ este guard quando o autor edita a descrição da PR (para adicionar o
# escape), sem re-rodar lint/build. O corpo da PR é lido via API em runtime
# (não do payload do evento) para que "Re-run" também veja a descrição
# atual — o payload de um re-run é o original, stale.
#
# Sem `paths:` de propósito: um required check filtrado por paths nunca
# reporta status em PR docs-only e travaria o merge para sempre. O job
# sempre roda e decide internamente (PR sem código sai verde em segundos).
#
# Para BLOQUEAR o merge (e não só ficar vermelho): GitHub → Settings → Branches
# → regra da `main` → "Require status checks to pass" → marcar `docs-guard`.
#
# Segurança: o corpo da PR NUNCA é interpolado via ${{ }} dentro de run:
# (injeção de shell); chega por `gh api` numa variável de ambiente lida pelo
# script. O script vem da `main` (ponta atual da base), não da branch da PR,
# para que uma PR não afrouxe a própria regra.
name: Docs Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: docs-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# O token default do runner pode vir restrito (contents: read apenas), e aí o
# `gh api pulls/N/files` responde 403 "Resource not accessible by integration".
# Declarar o bloco explícito garante exatamente o que o guard precisa.
permissions:
  contents: read
  pull-requests: read

jobs:
  docs-guard:
    name: docs-guard
    # dependabot só muda manifests — o skip explícito é cinto-e-suspensório
    # para nunca bloquear automação. Job "skipped" conta como sucesso em
    # required checks.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da base (a regra vale como está na main agora)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Código mudou sem a documentação certa?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/check-docs-matriz.mjs ]; then
            echo "A regra ainda não está na main (esta é a PR que a introduz): nada a cobrar."
            exit 0
          fi
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | "\(.status) \(.filename)", (select(.previous_filename) | "removed \(.previous_filename)")' \
            > "$RUNNER_TEMP/arquivos.txt"
          PR_BODY=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')
          export PR_BODY
          node scripts/check-docs-matriz.mjs --arquivos "$RUNNER_TEMP/arquivos.txt"
