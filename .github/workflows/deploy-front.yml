name: Deploy do front (VPS)

# Publica o front (build do Vite) no nginx da VPS a cada merge na main. A VPS é a única produção:
# a Vercel foi desligada para não haver um segundo site com versão ou banco diferentes.
#
# Ordem: o job `esperar` exige o "Quality Gates" (gate.sh) verde no mesmo commit e, se o merge trouxe migração,
# o workflow "Migrações do banco" do mesmo commit terminado com sucesso (inclui a aprovação no ambiente "producao";
# o front novo não chega antes do schema). Só então o job `deploy` publica.
#
# Troca sem quebrar quem está com o sistema aberto: primeiro sobem os arquivos com hash (assets/,
# workbox), depois index.html/sw.js/manifest, que apontam para eles. Assets antigos ficam por
# DIAS_ASSETS_ANTIGOS dias (padrão 14) e depois são apagados.
#
# Configuração:
#   Segredos SÓ no ambiente "deploy-front" (Settings → Environments; aceita apenas a branch main, sem aprovação):
#             VPS_SSH_HOST e VPS_SSH_KNOWN_HOSTS (os mesmos das migrações),
#             VPS_DEPLOY_USER e VPS_DEPLOY_KEY (usuário só para o deploy, dono apenas da pasta do site).
#   Variáveis (do repositório, públicas): VPS_FRONT_DIR (pasta que o nginx serve, ex.: /var/www/idjuv),
#              opcional VPS_APP_DIR (pasta do app.idjuv.online, ex.: /var/www/idjuv-app; recebe a mesma cópia do build),
#              opcionais VPS_SITE_DIR, VITE_APP_URL, VITE_SITE_URL (build `site`: institucional enxuto, ver docs/DESENVOLVIMENTO.md),
#              VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID, VITE_TENANT_SLUG
#              (valores públicos do front; a chave é a anon, protegida por RLS),
#              opcionais FRONT_URL (padrão https://idjuv.online, para a conferência final)
#              e DIAS_ASSETS_ANTIGOS.
# Sem a configuração o job FALHA (o merge não chegou ao ar). Guia: docs/DESENVOLVIMENTO.md (Deploy do front).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez, na ordem dos merges; nunca cancelar um no meio da cópia.
concurrency:
  group: deploy-front-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  esperar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Esperar o gate (Quality Gates) deste commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/esperar-workflow.sh quality.yml "$GITHUB_SHA" 60

      # Inclui o tempo até a aprovação no ambiente "producao". Commit sem migração: vale a aplicação mais recente na
      # main (se uma migração anterior foi recusada ou falhou, o front não sobe sem o schema de que depende).
      - name: Esperar as migrações
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^supabase/migrations/'; then
            bash scripts/ci/esperar-workflow.sh migracoes-banco.yml "$GITHUB_SHA" 330
          else
            bash scripts/ci/esperar-workflow.sh migracoes-banco.yml "$GITHUB_SHA" 330 --ultimo-da-main
          fi

  deploy:
    needs: esperar
    runs-on: ubuntu-latest
    # Segredos do deploy: o ambiente "deploy-front" só aceita a branch main.
    environment: deploy-front
    env:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      VPS_FRONT_DIR: ${{ vars.VPS_FRONT_DIR }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      VPS_SITE_DIR: ${{ vars.VPS_SITE_DIR }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      VITE_TENANT_SLUG: ${{ vars.VITE_TENANT_SLUG }}
      FRONT_URL: ${{ vars.FRONT_URL || 'https://idjuv.online' }}
      DIAS_ASSETS_ANTIGOS: ${{ vars.DIAS_ASSETS_ANTIGOS || '14' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configuração presente?
        run: |
          faltam=""
          for v in VPS_SSH_HOST VPS_SSH_KNOWN_HOSTS VPS_DEPLOY_USER VPS_DEPLOY_KEY VPS_FRONT_DIR \
                   VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID VITE_TENANT_SLUG; do
            [ -z "${!v}" ] && faltam="$faltam $v"
          done
          if [ -n "$faltam" ]; then
            echo "::error::Deploy do front NÃO feito: falta configurar$faltam (segredos no ambiente \"deploy-front\"). Ver docs/DESENVOLVIMENTO.md."
            echo "### Front não publicado: falta configurar$faltam" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` falha: o package-lock.json está fora de sincronia (ver AGENTS.md).
      - name: Build
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          # Trava: o build tem de apontar para o banco configurado
          host=$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')
          grep -rqF "$host" dist/assets || { echo "::error::build não contém $host"; exit 1; }
          test -s dist/index.html

      - name: Chave SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "RSH=ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Publicar
        run: |
          destino="${VPS_DEPLOY_USER}@${VPS_SSH_HOST}:${VPS_FRONT_DIR%/}/"
          # 1) tudo menos os pontos de entrada (assets com hash convivem com os antigos)
          rsync -rlz --chmod=D755,F644 -e "$RSH" \
            --exclude=/index.html --exclude=/sw.js --exclude=/registerSW.js --exclude=/manifest.webmanifest \
            dist/ "$destino"
          # 2) pontos de entrada, que passam a apontar para os assets novos
          rsync -rlz --chmod=F644 -e "$RSH" \
            dist/index.html dist/sw.js dist/registerSW.js dist/manifest.webmanifest "$destino"
          # 3) assets que nenhum build recente usa
          $RSH "${VPS_DEPLOY_USER}@${VPS_SSH_HOST}" \
            "find '${VPS_FRONT_DIR%/}/assets' -type f -mtime +${DIAS_ASSETS_ANTIGOS} -delete"
          # 4) arquivos de public/ retirados do repositório: o rsync acima não apaga nada no destino.
          #    data/cargos.json e .csv publicavam a indicação dos ocupantes (migração 20261010234000).
          $RSH "${VPS_DEPLOY_USER}@${VPS_SSH_HOST}" \
            "rm -f '${VPS_FRONT_DIR%/}/data/cargos.json' '${VPS_FRONT_DIR%/}/data/cargos.csv'"

      # Cópia completa do mesmo build para app.idjuv.online (sistema interno). Roda DEPOIS do site e só
      # se VPS_APP_DIR existir: sem a variável o passo é ignorado e o deploy do site não muda.
      - name: Publicar a cópia do app (app.idjuv.online)
        if: env.VPS_APP_DIR != ''
        run: |
          destino="${VPS_DEPLOY_USER}@${VPS_SSH_HOST}:${VPS_APP_DIR%/}/"
          rsync -rlz --chmod=D755,F644 -e "$RSH" \
            --exclude=/index.html --exclude=/sw.js --exclude=/registerSW.js --exclude=/manifest.webmanifest \
            dist/ "$destino"
          rsync -rlz --chmod=F644 -e "$RSH" \
            dist/index.html dist/sw.js dist/registerSW.js dist/manifest.webmanifest "$destino"
          $RSH "${VPS_DEPLOY_USER}@${VPS_SSH_HOST}" \
            "find '${VPS_APP_DIR%/}/assets' -type f -mtime +${DIAS_ASSETS_ANTIGOS} -delete"

      # Site institucional enxuto (build `site`, sem o sistema interno). Roda DEPOIS do site e do app e só se
      # VPS_SITE_DIR existir. Por ora vai para um host de teste; a troca de idjuv.online é decisão à parte.
      - name: Build do site institucional (VITE_APP_MODE=site)
        if: env.VPS_SITE_DIR != ''
        run: |
          npm run build:site
          node scripts/check-bundle-site.mjs dist-site
          host=$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')
          grep -rqF "$host" dist-site/assets || { echo "::error::build do site não contém $host"; exit 1; }
          test -s dist-site/index.html

      - name: Publicar o site institucional
        if: env.VPS_SITE_DIR != ''
        run: |
          destino="${VPS_DEPLOY_USER}@${VPS_SSH_HOST}:${VPS_SITE_DIR%/}/"
          rsync -rlz --chmod=D755,F644 -e "$RSH" \
            --exclude=/index.html --exclude=/sw.js \
            dist-site/ "$destino"
          rsync -rlz --chmod=F644 -e "$RSH" dist-site/index.html dist-site/sw.js "$destino"
          $RSH "${VPS_DEPLOY_USER}@${VPS_SSH_HOST}" \
            "find '${VPS_SITE_DIR%/}/assets' -type f -mtime +${DIAS_ASSETS_ANTIGOS} -delete"

      - name: Conferir o site no ar
        run: |
          entrada=$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -1)
          # o quadro antigo (com a indicação dos ocupantes) não pode continuar no ar; com o fallback de SPA
          # o caminho responde 200 com o index.html, então a checagem é pelo conteúdo
          antigo=$(curl -fsS -H 'Cache-Control: no-cache' "${FRONT_URL%/}/data/cargos.json" 2>/dev/null || true)
          case "$antigo" in
            *'"indicacao"'*)
              echo "::error::${FRONT_URL%/}/data/cargos.json ainda está no ar. Apague-o da pasta do nginx."
              exit 1 ;;
          esac
          for i in 1 2 3 4 5 6; do
            if curl -fsS -H 'Cache-Control: no-cache' "${FRONT_URL%/}/" | grep -qF "$entrada"; then
              echo "### Front publicado: ${FRONT_URL} serve \`$entrada\` (commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${FRONT_URL} não está servindo o build novo ($entrada). Confira VPS_FRONT_DIR e o cache do nginx."
          exit 1
