name: Deploy do front (VPS)

# Publica o front (build do Vite) no nginx da VPS a cada merge na main. A VPS é a única produção:
# a Vercel foi desligada para não haver um segundo site com versão ou banco diferentes.
#
# Ordem com o banco: se o merge trouxe migração, este job espera o workflow "Migrações do banco" do
# mesmo commit terminar com sucesso antes de publicar (o front novo não chega antes do schema).
#
# Troca sem quebrar quem está com o sistema aberto: primeiro sobem os arquivos com hash (assets/,
# workbox), depois index.html/sw.js/manifest, que apontam para eles. Assets antigos ficam por
# DIAS_ASSETS_ANTIGOS dias (padrão 14) e depois são apagados.
#
# Configuração (Settings → Secrets and variables → Actions):
#   Segredos: VPS_SSH_HOST e VPS_SSH_KNOWN_HOSTS (os mesmos das migrações),
#             VPS_DEPLOY_USER e VPS_DEPLOY_KEY (usuário só para o deploy, dono apenas da pasta do site).
#   Variáveis: VPS_FRONT_DIR (pasta que o nginx serve, ex.: /var/www/idjuv),
#              VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID, VITE_TENANT_SLUG
#              (valores públicos do front; a chave é a anon, protegida por RLS),
#              opcionais FRONT_URL (padrão https://idjuv.online, para a conferência final)
#              e DIAS_ASSETS_ANTIGOS.
# Sem a configuração o job avisa e não falha. Guia: docs/DESENVOLVIMENTO.md (Deploy do front).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez, na ordem dos merges; nunca cancelar um no meio da cópia.
concurrency:
  group: deploy-front-producao
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      VPS_FRONT_DIR: ${{ vars.VPS_FRONT_DIR }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      VITE_TENANT_SLUG: ${{ vars.VITE_TENANT_SLUG }}
      FRONT_URL: ${{ vars.FRONT_URL || 'https://idjuv.online' }}
      DIAS_ASSETS_ANTIGOS: ${{ vars.DIAS_ASSETS_ANTIGOS || '14' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configuração presente?
        id: config
        run: |
          faltam=""
          for v in VPS_SSH_HOST VPS_SSH_KNOWN_HOSTS VPS_DEPLOY_USER VPS_DEPLOY_KEY VPS_FRONT_DIR \
                   VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID VITE_TENANT_SLUG; do
            [ -z "${!v}" ] && faltam="$faltam $v"
          done
          if [ -n "$faltam" ]; then
            echo "::warning::Deploy do front NÃO feito: falta configurar$faltam. Ver docs/DESENVOLVIMENTO.md."
            echo "### Front não publicado: falta configurar$faltam" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Esperar as migrações deste commit
        if: steps.config.outputs.ok == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --name-only HEAD~1 HEAD | grep -q '^supabase/migrations/'; then
            echo "Commit sem migração: segue."; exit 0
          fi
          echo "Commit traz migração: esperando o workflow de migrações do mesmo commit."
          for i in $(seq 1 60); do
            estado=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow migracoes-banco.yml \
              --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            case "$estado" in
              "completed success") echo "Migrações aplicadas."; exit 0 ;;
              completed*) echo "::error::Migrações deste commit falharam ($estado): front NÃO publicado."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Migrações não terminaram em 20 minutos: front NÃO publicado."; exit 1

      - name: Setup Node
        if: steps.config.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` falha: o package-lock.json está fora de sincronia (ver AGENTS.md).
      - name: Build
        if: steps.config.outputs.ok == 'true'
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          # Trava: o build tem de apontar para o banco configurado
          host=$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')
          grep -rqF "$host" dist/assets || { echo "::error::build não contém $host"; exit 1; }
          test -s dist/index.html

      - name: Chave SSH
        if: steps.config.outputs.ok == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "RSH=ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Publicar
        if: steps.config.outputs.ok == 'true'
        run: |
          destino="${VPS_DEPLOY_USER}@${VPS_SSH_HOST}:${VPS_FRONT_DIR%/}/"
          # 1) tudo menos os pontos de entrada (assets com hash convivem com os antigos)
          rsync -rlz --chmod=D755,F644 -e "$RSH" \
            --exclude=/index.html --exclude=/sw.js --exclude=/registerSW.js --exclude=/manifest.webmanifest \
            dist/ "$destino"
          # 2) pontos de entrada, que passam a apontar para os assets novos
          rsync -rlz --chmod=F644 -e "$RSH" \
            dist/index.html dist/sw.js dist/registerSW.js dist/manifest.webmanifest "$destino"
          # 3) assets que nenhum build recente usa
          $RSH "${VPS_DEPLOY_USER}@${VPS_SSH_HOST}" \
            "find '${VPS_FRONT_DIR%/}/assets' -type f -mtime +${DIAS_ASSETS_ANTIGOS} -delete"
          # 4) arquivos de public/ retirados do repositório: o rsync acima não apaga nada no destino.
          #    data/cargos.json e .csv publicavam a indicação dos ocupantes (migração 20261010234000).
          $RSH "${VPS_DEPLOY_USER}@${VPS_SSH_HOST}" \
            "rm -f '${VPS_FRONT_DIR%/}/data/cargos.json' '${VPS_FRONT_DIR%/}/data/cargos.csv'"

      - name: Conferir o site no ar
        if: steps.config.outputs.ok == 'true'
        run: |
          entrada=$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -1)
          # o quadro antigo (com a indicação dos ocupantes) não pode continuar no ar; com o fallback de SPA
          # o caminho responde 200 com o index.html, então a checagem é pelo conteúdo
          antigo=$(curl -fsS -H 'Cache-Control: no-cache' "${FRONT_URL%/}/data/cargos.json" 2>/dev/null || true)
          case "$antigo" in
            *'"indicacao"'*)
              echo "::error::${FRONT_URL%/}/data/cargos.json ainda está no ar. Apague-o da pasta do nginx."
              exit 1 ;;
          esac
          for i in 1 2 3 4 5 6; do
            if curl -fsS -H 'Cache-Control: no-cache' "${FRONT_URL%/}/" | grep -qF "$entrada"; then
              echo "### Front publicado: ${FRONT_URL} serve \`$entrada\` (commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${FRONT_URL} não está servindo o build novo ($entrada). Confira VPS_FRONT_DIR e o cache do nginx."
          exit 1
