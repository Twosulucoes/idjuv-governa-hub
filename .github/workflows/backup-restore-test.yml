name: Teste de restauração do backup

# Uma vez por mês baixa o backup mais recente da VPS (gerado por scripts/backup/backup-vps.sh),
# decifra, restaura num Postgres descartável com a mesma imagem do Supabase self-hosted e confere
# a contagem de linhas contra o manifesto. Backup que nunca foi restaurado não é backup.
#
# Secrets do ambiente "backup" (Settings → Environments → backup; só a branch main), explicados em docs/BACKUP.md:
#   BACKUP_RCLONE_CONF   conteúdo do rclone.conf com o remoto do backup (pode ser só-leitura)
#   BACKUP_RCLONE_REMOTE remoto + bucket, igual ao da VPS (ex.: r2:idjuv-backups)
#   BACKUP_AGE_KEY       chave PRIVADA do age (arquivo gerado por age-keygen)
# Variável opcional: SUPABASE_PG_IMAGE (padrão abaixo) — use a mesma imagem do container db da VPS.
#
# O log mostra só contagens e a primeira linha de cada erro do pg_restore, nunca dados.
# Reprova também sem configuração (o teste agendado não pode ficar verde sem testar nada) e sem o pacote do
# Storage, ou com menos arquivos nele que objetos em storage.objects. O dia a dia é vigiado pelo backup-vigia.yml.
on:
  schedule:
    - cron: "0 9 3 * *" # dia 3 de cada mês, 06:00 em Brasília
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do backup no remoto (vazio = diário mais recente). Ex.: mensal/2026-10-01"
        required: false

permissions:
  contents: read

concurrency:
  group: backup-restore-test
  cancel-in-progress: false

jobs:
  restaurar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Segredos BACKUP_* SÓ no ambiente "backup" (aceita apenas a branch main, sem aprovação: o teste é agendado).
    environment: backup
    env:
      RCLONE_CONF: ${{ secrets.BACKUP_RCLONE_CONF }}
      REMOTO: ${{ secrets.BACKUP_RCLONE_REMOTE }}
      AGE_KEY: ${{ secrets.BACKUP_AGE_KEY }}
      IMAGEM: ${{ vars.SUPABASE_PG_IMAGE || 'supabase/postgres:17.6.1.136' }}
      PASTA: ${{ inputs.pasta }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Conferir configuração
        run: |
          if [ -z "$RCLONE_CONF" ] || [ -z "$REMOTO" ] || [ -z "$AGE_KEY" ]; then
            echo "::error::Backup não configurado (faltam secrets BACKUP_* no ambiente backup). Ver docs/BACKUP.md."
            exit 1
          fi

      - name: Instalar rclone e age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone age

      - name: Baixar e decifrar o backup
        run: |
          set -euo pipefail
          umask 077
          PASTA_INFORMADA="$PASTA"
          mkdir -p ~/.config/rclone "$RUNNER_TEMP/bk" "$RUNNER_TEMP/dados"
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          # aceita o arquivo inteiro do age-keygen ou só a linha da chave, com espaços ou CRLF de cópia
          if ! printf '%s\n' "$AGE_KEY" | tr -d ' \r' | grep -oE 'AGE-SECRET-KEY-1[0-9A-Z]+' > "$RUNNER_TEMP/chave.key"; then
            echo "::error::BACKUP_AGE_KEY não tem a chave PRIVADA do age (linha AGE-SECRET-KEY-1...). A chave pública (age1...) não decifra. Ver docs/BACKUP.md."
            exit 1
          fi
          if [ -z "$PASTA" ]; then
            ultimo=$(rclone lsf --dirs-only "$REMOTO/diario" | sort | tail -1)
            [ -n "$ultimo" ] || { echo "::error::nenhum backup em $REMOTO/diario"; exit 1; }
            PASTA="diario/${ultimo%/}"
          fi
          echo "Backup testado: $PASTA"
          echo "### Backup testado: \`$PASTA\`" >> "$GITHUB_STEP_SUMMARY"
          idade=$(( ( $(date -u +%s) - $(date -u -d "${PASTA##*/}" +%s) ) / 86400 ))
          if [ "$idade" -gt 2 ] && [ -z "$PASTA_INFORMADA" ]; then
            echo "::error::o backup diário mais recente tem $idade dias: o cron da VPS parou?"; exit 1
          fi
          rclone copy "$REMOTO/$PASTA" "$RUNNER_TEMP/bk"
          cp "$RUNNER_TEMP/bk/manifesto.tsv" "$RUNNER_TEMP/dados/"
          for f in banco.dump papeis.sql; do
            age -d -i "$RUNNER_TEMP/chave.key" -o "$RUNNER_TEMP/dados/$f" "$RUNNER_TEMP/bk/$f.age"
          done
          [ -f "$RUNNER_TEMP/bk/storage.tar.gz.age" ] \
            || { echo "::error::o backup não tem storage.tar.gz.age: os arquivos do Storage não voltariam."; exit 1; }
          # lê o pacote inteiro (prova que decifra e descompacta) e conta só arquivos, sem listar nomes no log
          age -d -i "$RUNNER_TEMP/chave.key" -o "$RUNNER_TEMP/bk/storage.tar.gz" "$RUNNER_TEMP/bk/storage.tar.gz.age"
          tar -tvzf "$RUNNER_TEMP/bk/storage.tar.gz" > "$RUNNER_TEMP/bk/storage.lista"
          arquivos=$(grep -c '^-' "$RUNNER_TEMP/bk/storage.lista" || true)
          objetos=$(awk -F'\t' '$1 == "storage.objects" {print $2}' "$RUNNER_TEMP/dados/manifesto.tsv")
          echo "Storage: $arquivos arquivos no pacote, ${objetos:-0} objetos no banco" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$arquivos" -ge "${objetos:-0}" ] \
            || { echo "::error::o pacote do Storage tem menos arquivos que objetos no banco."; exit 1; }
          rm -f "$RUNNER_TEMP/chave.key"

      - name: Restaurar e conferir
        run: |
          set -euo pipefail
          docker run -d --name pgteste -e POSTGRES_PASSWORD=postgres \
            -v "$RUNNER_TEMP/dados:/restore" -v "$PWD/scripts/backup:/scripts:ro" "$IMAGEM" >/dev/null
          for i in $(seq 1 60); do
            docker exec pgteste pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 2
          done
          sleep 5 # o entrypoint da imagem reinicia o Postgres depois dos scripts de init
          for i in $(seq 1 30); do
            docker exec pgteste pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 2
          done
          docker exec -e PGHOST=127.0.0.1 -e PGUSER=supabase_admin -e PGPASSWORD=postgres pgteste \
            bash /scripts/testar-restauracao.sh /restore | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Limpar
        if: always()
        run: |
          docker rm -f pgteste >/dev/null 2>&1 || true
          sudo rm -rf "$RUNNER_TEMP/bk" "$RUNNER_TEMP/dados" ~/.config/rclone
