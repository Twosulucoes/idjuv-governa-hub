name: Migrações do banco

# Aplica supabase/migrations/ no banco de produção (Supabase self-hosted da VPS):
#   - pull_request: NÃO toca a produção nem recebe segredo nenhum. Confere versões duplicadas e lista no resumo as
#     migrações que o PR traz. O replay do zero e o teste de RLS ficam com o workflow "Banco do zero e RLS".
#   - push na main (= merge) e manual (workflow_dispatch na main): espera o "Banco do zero e RLS" passar no MESMO
#     commit (no manual, rode antes o "Banco do zero e RLS" na main se o commit não mexeu no banco) e só então pede
#     aprovação no ambiente "producao"; aprovado, simula, confere a trava e aplica.
# O banco só muda quando o código que depende dele entra na main e alguém aprova; PR recusado não deixa tabela órfã.
#
# Segredos: SÓ no ambiente "producao" (Settings → Environments), que exige aprovação e aceita apenas a branch main.
# Assim nenhum PR (nem um que altere este arquivo) alcança a senha do banco ou a chave SSH.
#   VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY (chave privada de um usuário só para isto),
#   VPS_SSH_KNOWN_HOSTS (saída de `ssh-keyscan <host>`, fixa a identidade da VPS),
#   SUPABASE_DB_SENHA (senha do papel postgres).
# Variável opcional DB_DESTINO_NA_VPS (padrão 127.0.0.1:5432): onde o Postgres escuta, visto da VPS.
# Sem os segredos o job FALHA (o merge trouxe migração e ela não foi aplicada). Guia: docs/DESENVOLVIMENTO.md.
#
# Trava de segurança: se o banco remoto não reconhecer o histórico (supabase_migrations.schema_migrations
# vazio ou divergente), o push tentaria rodar centenas de migrações antigas. Acima de LIMITE_MIGRACOES
# (variável do repositório, padrão 10) o job falha sem aplicar nada — conserte o histórico com
# `supabase migration repair` (docs/DESENVOLVIMENTO.md) ou aumente o limite conscientemente.
on:
  pull_request:
    branches: [main]
    paths: ["supabase/migrations/**"]
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

# Nunca duas aplicações ao mesmo tempo, e nunca cancelar uma no meio.
# PR agrupa pelo número (o nome da branch de um fork não entra no grupo de produção).
concurrency:
  group: migracoes-banco-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'producao' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # PR: sem segredo, sem produção.
  simular:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard — migrações sem versão duplicada
        run: bash scripts/check-migrations.sh

      - name: Migrações que este PR traz
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          novas=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- supabase/migrations/ | sed 's#.*/##' || true)
          mudadas=$(git diff --name-only --diff-filter=MDR "$BASE_SHA" HEAD -- supabase/migrations/ | sed 's#.*/##' || true)
          {
            echo "### Migrações deste PR: $(printf '%s' "$novas" | grep -c . || true) nova(s)"
            [ -n "$novas" ] && printf '%s\n' "$novas" | sed 's/^/- `/; s/$/`/'
            if [ -n "$mudadas" ]; then
              echo; echo "**Atenção:** migração já existente alterada ou removida (a produção não reaplica):"
              printf '%s\n' "$mudadas" | sed 's/^/- `/; s/$/`/'
            fi
            echo
            echo "Nada foi aplicado. No merge, as pendentes são aplicadas depois do \"Banco do zero e RLS\" passar e da aprovação no ambiente \"producao\"."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$mudadas" ]; then
            echo "::warning::Este PR altera ou remove migração já existente: $(echo $mudadas)"
          fi

  # Merge/manual: só segue se o replay do zero e o teste de RLS passaram neste commit.
  conferir:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Esperar o "Banco do zero e RLS" deste commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/esperar-workflow.sh banco-rls.yml "$GITHUB_SHA" 30

  aplicar:
    needs: conferir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Aprovação e segredos: o ambiente "producao" exige revisor e só aceita a branch main.
    environment: producao
    # Segredos só no `env` dos passos que precisam deles (a instalação da CLI roda antes e sem eles).
    env:
      DB_DESTINO_NA_VPS: ${{ vars.DB_DESTINO_NA_VPS || '127.0.0.1:5432' }}
      LIMITE_MIGRACOES: ${{ vars.LIMITE_MIGRACOES || '10' }}
      SUPABASE_CLI_VERSAO: 2.118.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Versão fixa da CLI (instalada do npm), em vez de uma action de terceiro com `latest`.
      - name: Supabase CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/supabase" --no-audit --no-fund "supabase@${SUPABASE_CLI_VERSAO}" >/dev/null
          echo "$RUNNER_TEMP/supabase/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Segredos configurados?
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SUPABASE_DB_SENHA: ${{ secrets.SUPABASE_DB_SENHA }}
        run: |
          faltam=""
          for v in VPS_SSH_HOST VPS_SSH_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS SUPABASE_DB_SENHA; do
            [ -z "${!v}" ] && faltam="$faltam $v"
          done
          if [ -n "$faltam" ]; then
            echo "::error::Migrações NÃO aplicadas: faltam no ambiente \"producao\" os segredos$faltam. Ver docs/DESENVOLVIMENTO.md."
            echo "### Migrações NÃO aplicadas: faltam segredos$faltam" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Guard — migrações sem versão duplicada
        run: bash scripts/check-migrations.sh

      - name: Túnel SSH até a VPS
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SUPABASE_DB_SENHA: ${{ secrets.SUPABASE_DB_SENHA }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps && chmod 600 ~/.ssh/id_vps
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # -N: só o túnel, sem shell; StrictHostKeyChecking: só a VPS conhecida
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 -f -N -L "127.0.0.1:54322:${DB_DESTINO_NA_VPS}" \
            "${VPS_SSH_USER}@${VPS_SSH_HOST}"
          rm -f ~/.ssh/id_vps
          senha=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_SENHA"],safe=""))')
          echo "::add-mask::$senha"
          echo "SUPABASE_DB_URL=postgresql://postgres:${senha}@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      # --include-all: PRs mergeados fora da ordem dos números deixam pendente uma migração mais antiga que a última do
      # banco; sem ela o push recusa tudo. A trava abaixo continua valendo para o total de pendentes.
      - name: Simular (dry-run) e conferir a trava
        run: |
          set -o pipefail
          supabase --version
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run 2>&1 | tee /tmp/dry-run.log
          pendentes=$(grep -oE '[0-9]{14}_[^ ]*\.sql' /tmp/dry-run.log | sort -u || true)
          total=$(printf '%s' "$pendentes" | grep -c . || true)
          {
            echo "### Migrações pendentes no banco de produção: $total"
            [ "$total" -gt 0 ] && printf '%s\n' "$pendentes" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt "$LIMITE_MIGRACOES" ]; then
            echo "::error::$total migrações pendentes (limite $LIMITE_MIGRACOES). O histórico do banco remoto provavelmente diverge do repositório; nada foi aplicado. Ver docs/DESENVOLVIMENTO.md."
            exit 1
          fi

      - name: Aplicar
        id: aplicar
        run: |
          set -o pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all 2>&1 | tee /tmp/push.log
          echo "### Migrações aplicadas em produção" >> "$GITHUB_STEP_SUMMARY"

      # Trilha dos arquivos do RH (migração 20261011000200): sem o privilégio TRIGGER em storage.objects a migração só
      # emite WARNING e os arquivos ficam sem trilha. Aqui isso vira falha visível (o banco já foi alterado; o job
      # vermelho avisa que falta ligar os triggers à mão — docs/BANCO_DE_DADOS.md).
      - name: Conferir trilha do Storage do RH
        if: always() && steps.aplicar.outcome == 'success'
        run: |
          n=$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 \
                -c "select count(*) from pg_trigger where tgrelid = 'storage.objects'::regclass and tgname like 'trilha_rh_storage_%' and tgenabled <> 'D'")
          echo "Triggers trilha_rh_storage_* ligados em storage.objects: $n" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" != "3" ]; then
            echo "::error::trilha do Storage do RH: esperava 3 triggers trilha_rh_storage_* em storage.objects, achei '$n'. Ver docs/BANCO_DE_DADOS.md."
            exit 1
          fi

      # Integridade da remessa CNAB e do eSocial (migração 20261011010000): os três índices únicos têm que existir (a
      # migração os cria sempre, deixando de fora só linhas antigas repetidas) e a função remessa_integridade, que confere
      # o objeto em storage.objects, precisa de dono com BYPASSRLS (o postgres do Supabase tem). Falha visível aqui.
      - name: Conferir integridade da remessa e do eSocial
        if: always() && steps.aplicar.outcome == 'success'
        run: |
          n=$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_index i where i.indisunique and i.indexrelid in (to_regclass('public.remessas_bancarias_conta_numero_uidx'), to_regclass('public.remessas_bancarias_folha_conta_ativa_uidx'), to_regclass('public.eventos_esocial_folha_evento_servidor_uidx'))")
          b=$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select coalesce(bool_or(r.rolbypassrls or r.rolsuper), false) from pg_proc p join pg_roles r on r.oid = p.proowner where p.oid = to_regprocedure('public.remessa_integridade()')")
          echo "Índices únicos da E3 (remessa e eSocial): $n de 3; dono de remessa_integridade com BYPASSRLS: $b" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" != "3" ]; then
            echo "::error::E3: esperava 3 índices únicos (remessas_bancarias_conta_numero_uidx, remessas_bancarias_folha_conta_ativa_uidx, eventos_esocial_folha_evento_servidor_uidx), achei '$n'. Ver docs/BANCO_DE_DADOS.md."
            exit 1
          fi
          if [ "$b" != "t" ]; then
            echo "::error::E3: o dono de remessa_integridade() não tem BYPASSRLS; a conferência do arquivo no bucket remessas-cnab recusaria todo arquivo. Ver docs/BANCO_DE_DADOS.md."
            exit 1
          fi
