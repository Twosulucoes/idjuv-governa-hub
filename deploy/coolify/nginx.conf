# nginx dentro da imagem do front (Dockerfile na raiz). O Traefik do Coolify cuida do domínio e do HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/cabecalhos-seguranca.conf;

    # Arquivos com hash: cache longo (o nome muda a cada build).
    location /assets/ {
        include /etc/nginx/cabecalhos-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pontos de entrada: sempre revalidar, para o navegador pegar o build novo.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA: qualquer rota do react-router cai no index.html.
    location / {
        include /etc/nginx/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
