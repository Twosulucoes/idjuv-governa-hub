# Cabeçalhos de segurança do front (SPA do Vite) servido pelo nginx da VPS.
#
# Uso: `include /caminho/para/deploy/nginx/cabecalhos-seguranca.conf;` dentro do bloco `server { }`
# de cada site que serve o build (site público e sistema interno).
#
# Atenção ao modelo do nginx: `add_header` só é herdado por um `location` que NÃO tenha nenhum
# `add_header` próprio. Se um `location` (ex.: cache de /assets/) declarar `add_header`, inclua
# este arquivo também nele, senão os cabeçalhos somem nessas respostas.
#
# Auditoria de segurança P12 (17/10/2026). Ao adicionar recurso externo novo no app (fonte, API,
# mapa, script), ajuste a CSP aqui na mesma PR.

# ---------------------------------------------------------------------------------------------
# Content-Security-Policy
#
# default-src 'self'           tudo que não tem diretiva própria só da própria origem.
# script-src 'self'            só os bundles do build; nada inline nem de CDN. O registro do service
#                              worker (vite-plugin-pwa) é arquivo próprio (/registerSW.js) e o worker
#                              do pdfjs é emitido no build (mesma origem). A janela de impressão de
#                              etiquetas (about:blank) herda esta política: por isso ela não usa
#                              <script> inline.
# style-src 'unsafe-inline'    exceção: Radix/shadcn, recharts (<style> do ChartContainer),
#                              framer-motion e leaflet aplicam estilo inline em tempo de execução.
#   https://fonts.googleapis.com  exceção: CSS das fontes IBM Plex Sans e Merriweather
#                              (@import em src/index.css).
# font-src https://fonts.gstatic.com  exceção: arquivos das fontes do Google Fonts. data: para
#                              fontes embutidas em CSS de bibliotecas.
# img-src https: data: blob:   exceção ampla: notícias/CMS e mídia com imagem de qualquer host
#                              https (inclusive Storage do Supabase), imagens ilustrativas
#                              (images.unsplash.com), tiles do mapa de inventário
#                              (tile.openstreetmap.org e server.arcgisonline.com), QR codes e fotos
#                              da câmera (data:/blob:).
# connect-src                  API, Auth, Storage, Edge Functions e Realtime do Supabase.
#   https://bd.idjuv.online / wss://bd.idjuv.online  o host do banco é o de VITE_SUPABASE_URL do
#                              build: em outra instalação (outro tenant), troque pelos valores do
#                              .env dela. Fica aqui (config de deploy), nunca no código do app.
#   https://brasilapi.com.br   exceção: feriados nacionais (src/hooks/useDatasImportantes.ts).
#   data: blob:                fetch() de foto capturada (data URL) antes do upload no PWA de
#                              patrimônio, e de arquivos gerados localmente.
# worker-src 'self' blob:      service worker do PWA e worker do pdfjs (mesma origem).
# frame-ancestors 'none'       ninguém incorpora o app em iframe (clickjacking).
# object-src 'none', base-uri 'self', form-action 'self'.
#
# Não há iframe de terceiros (YouTube, mapas embutidos) no app hoje: frame-src cai em
# default-src 'self'. Navegação para links externos (redes sociais, wa.me, portais) não é
# afetada pela CSP.
# ---------------------------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://bd.idjuv.online wss://bd.idjuv.online https://brasilapi.com.br data: blob:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# Bloqueia o app dentro de iframe em navegadores sem suporte a frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Impede o navegador de "adivinhar" o tipo do arquivo (ex.: tratar upload como script).
add_header X-Content-Type-Options "nosniff" always;

# Envia só a origem para outros sites (não vaza caminho/parâmetros como id de processo).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Recursos do navegador:
#   camera=(self)       PWA de patrimônio tira foto do bem e lê QR code (CameraCapture, QRCodeScanner).
#   geolocation=(self)  vistoria de unidade registra a posição (src/hooks/useGeolocalizacao.ts).
#   demais negados: o app não usa microfone, pagamento, USB etc.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
